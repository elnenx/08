  <style>
    /* ========================================================================
       1. DESIGN SYSTEM TOKENS & TRUE NATIVE WEB APP VIEWPORT LOCK
       ======================================================================== */
    :root {
      --bg-app: #0F352B;
      --bg-table: #123D32;
      --bg-card: #11392F;
      --bg-input: #0C2B23;
      --bg-secondary: #1A5142;
      --bg-icon: #1A4B3E;
      --border-card: #235547;
      --border-strong: #2A6152;
      --gold: #D6B56D;
      --gold-hover: #E3C47E;
      --gold-text: #0F352B;
      --ivory: #F5F0E5;
      --pips: #20231F;
      --text-main: #FFFFFF;
      --text-muted: #B7C9C1;
      --danger: #D95C5C;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
    }

    html[dir="ltr"] body {
      font-family: 'Inter', 'Cairo', system-ui, -apple-system, sans-serif;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .app-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .app-scroll::-webkit-scrollbar-track { background: transparent; }
    .app-scroll::-webkit-scrollbar-thumb { background: rgba(214, 181, 109, 0.25); border-radius: 999px; }

    /* ========================================================================
       2. 60FPS MOTION GRAPHICS & SPRING ANIMATIONS
       ======================================================================== */
    @keyframes splashFlip3D {
      0% { transform: perspective(750px) rotateY(-180deg) scale(0.55); opacity: 0; }
      65% { transform: perspective(750px) rotateY(14deg) scale(1.06); opacity: 1; }
      100% { transform: perspective(750px) rotateY(0deg) scale(1); opacity: 1; }
    }

    @keyframes fadeUpSpring {
      0% { opacity: 0; transform: translateY(14px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes viewTransitionIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cardMorphIn {
      0% { opacity: 0; transform: translateY(6px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes ambientSpotlight {
      0%, 100% { opacity: 0.16; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.28; transform: translateX(-50%) scale(1.08); }
    }

    @keyframes floatTileA {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-18deg); }
      50% { transform: translate3d(0, -16px, 0) rotate(-11deg); }
    }

    @keyframes floatTileB {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(21deg); }
      50% { transform: translate3d(0, 14px, 0) rotate(14deg); }
    }

    @keyframes goldSheen {
      0% { transform: translateX(-140%) skewX(-18deg); }
      42% { transform: translateX(160%) skewX(-18deg); }
      100% { transform: translateX(160%) skewX(-18deg); }
    }

    @keyframes tileDropIn {
      0% { transform: scale(1.32) translateY(-10px); opacity: 0; }
      65% { transform: scale(0.97) translateY(1px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes impactRipple {
      0% { transform: scale(0.92); opacity: 0.95; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    @keyframes turnHalo {
      0%, 100% { box-shadow: 0 0 0 0 rgba(214, 181, 109, 0.36), 0 0 18px rgba(214, 181, 109, 0.22); }
      50% { box-shadow: 0 0 0 5px rgba(214, 181, 109, 0.08), 0 0 28px rgba(214, 181, 109, 0.45); }
    }

    @keyframes endPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(214, 181, 109, 0.3); }
      50% { box-shadow: 0 0 18px 2px rgba(214, 181, 109, 0.65); }
    }

    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); opacity: 0.6; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes modalPop {
      0% { transform: scale(0.92) translateY(14px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes radarWave {
      0% { transform: scale(1); opacity: 0.72; }
      100% { transform: scale(1.95); opacity: 0; }
    }

    @keyframes toastEnter {
      0% { transform: translate(-50%, -20px) scale(0.94); opacity: 0; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    .anim-splash-3d { animation: splashFlip3D 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-fade-up { animation: fadeUpSpring 0.4s 0.18s ease-out both; }
    .anim-view { animation: viewTransitionIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-card-morph { animation: cardMorphIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-spotlight { animation: ambientSpotlight 8s ease-in-out infinite; }
    .anim-float-a { animation: floatTileA 18s ease-in-out infinite; }
    .anim-float-b { animation: floatTileB 22s ease-in-out infinite; }
    .anim-tile-drop { animation: tileDropIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-turn-halo { animation: turnHalo 2s ease-in-out infinite; }
    .anim-end-pulse { animation: endPulse 1.3s ease-in-out infinite; }
    .anim-sheet { animation: sheetSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-modal { animation: modalPop 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-toast { animation: toastEnter 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* ========================================================================
       3. PRIMARY GOLD SHIMMER BUTTON & SEGMENTED SWITCHER
       ======================================================================== */
    .btn-gold {
      position: relative;
      overflow: hidden;
      background-color: var(--gold);
      color: var(--gold-text);
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(214, 181, 109, 0.24);
      transition: transform 0.14s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-gold:hover:not(:disabled) {
      background-color: var(--gold-hover);
      box-shadow: 0 10px 26px rgba(214, 181, 109, 0.34);
    }
    .btn-gold:active:not(:disabled) {
      transform: scale(0.97);
    }
    .btn-gold:disabled {
      background-color: rgba(23, 70, 58, 0.65);
      color: rgba(183, 201, 193, 0.45);
      border: 1px solid var(--border-card);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-gold:not(:disabled)::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 55%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: translateX(-140%) skewX(-18deg);
      animation: goldSheen 3.6s infinite;
      pointer-events: none;
    }

    .segmented-track {
      position: relative;
      background-color: #0B2A22;
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .segmented-thumb {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: calc(50% - 4px);
      border-radius: 12px;
      background: linear-gradient(180deg, #DFBF78 0%, #D6B56D 100%);
      box-shadow: 0 4px 14px rgba(214, 181, 109, 0.28);
      transition: inset-inline-start 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    /* ========================================================================
       4. REALISTIC 3D-BEVELED WARM IVORY DOMINO TILES
       ======================================================================== */
    .domino-tile {
      position: relative;
      background: linear-gradient(165deg, #FAF6EE 0%, #F5F0E5 60%, #EAE1CE 100%);
      border: 1px solid #C9BEA7;
      border-radius: 10px;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.4),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -3px 0 rgba(155, 140, 112, 0.45);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      flex-shrink: 0;
    }

    .domino-tile.board-tile {
      border-radius: 6px;
      padding: 2px;
      box-shadow:
        0 3px 7px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        inset 0 -2px 0 rgba(148, 134, 107, 0.5);
    }

    .domino-tile.playable {
      box-shadow:
        0 0 0 2px rgba(214, 181, 109, 0.8),
        0 8px 16px rgba(0, 0, 0, 0.44),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -3px 0 rgba(155, 140, 112, 0.45);
      cursor: pointer;
    }

    .domino-tile.playable:hover {
      transform: translateY(-6px);
    }

    .domino-tile.selected {
      transform: translateY(-14px) scale(1.04) !important;
      box-shadow:
        0 0 0 2.5px #D6B56D,
        0 16px 28px rgba(214, 181, 109, 0.44),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.98),
        inset 0 -3px 0 rgba(155, 140, 112, 0.45);
      z-index: 12;
    }

    .domino-tile.dimmed {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .domino-impact-ring {
      position: absolute;
      inset: 0;
      border-radius: 7px;
      border: 2px solid #D6B56D;
      animation: impactRipple 0.65s ease-out forwards;
      pointer-events: none;
    }

    .domino-back {
      background: linear-gradient(145deg, #1A5142, #123B30);
      border: 1px solid #2A6152;
      border-radius: 6px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .table-felt {
      background-color: var(--bg-table);
      background-image:
        radial-gradient(ellipse at 50% 45%, rgba(28, 94, 76, 0.48) 0%, rgba(18, 61, 50, 0.88) 72%, rgba(10, 35, 28, 0.96) 100%);
      box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.46);
    }
  </style>

      function isIosDevice() {

      }

      function checkIsStandalone() {

      // Generate a crisp 512x512 PNG Apple Touch Icon for iOS Home Screen
      function generateAppleTouchIcon() {
        try {
          const c = document.createElement('canvas');
          c.width = 512;
          c.height = 512;
          const ctx = c.getContext('2d');

          // Emerald background
          ctx.fillStyle = '#0F352B';
          ctx.fillRect(0, 0, 512, 512);

          // Subtle gold radial glow
          const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 240);
          grad.addColorStop(0, 'rgba(214,181,109,0.28)');
          grad.addColorStop(1, 'rgba(15,53,43,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 512, 512);

          // Ivory Domino Card
          const x = 148, y = 74, w = 216, h = 364, r = 42;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
          ctx.fillStyle = '#F5F0E5';
          ctx.fill();
          ctx.lineWidth = 14;
          ctx.strokeStyle = '#D6B56D';
          ctx.stroke();

          // Divider
          ctx.beginPath();
          ctx.moveTo(186, 256);
          ctx.lineTo(326, 256);
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#D6B56D';
          ctx.stroke();

          // Pips (1 top, 4 bottom)
          const dot = (dx, dy, rad) => {
            ctx.beginPath();
            ctx.arc(dx, dy, rad, 0, Math.PI * 2);
            ctx.fillStyle = '#20231F';
            ctx.fill();
          };
          dot(256, 166, 24);
          dot(208, 314, 21);
          dot(304, 314, 21);
          dot(208, 382, 21);
          dot(304, 382, 21);

          const iconLink = document.getElementById('pwa-apple-icon');
          if (iconLink) iconLink.href = c.toDataURL('image/png');

      // ======================================================================
      // 3. SYNTHESIZED WEB AUDIO ENGINE & HAPTICS ENGINE
      // ======================================================================
      const audioEngine = {
        ctx: null,
        enabled: true,

        ensure() {
          if (!this.enabled) return null;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },

        tap() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.042);
          g.gain.setValueAtTime(0.075, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.048);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.052);
        },

        clack() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1060, now);
          osc.frequency.exponentialRampToValueAtTime(165, now + 0.062);
          g.gain.setValueAtTime(0.22, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.072);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.078);

          const thud = ctx.createOscillator();
          const tg = ctx.createGain();
          thud.type = 'sine';
          thud.frequency.setValueAtTime(150, now + 0.01);
          thud.frequency.exponentialRampToValueAtTime(52, now + 0.09);
          tg.gain.setValueAtTime(0.16, now + 0.01);
          tg.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
          thud.connect(tg);
          tg.connect(ctx.destination);
          thud.start(now + 0.01);
          thud.stop(now + 0.1);
        },

        drawSwoosh() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.09);
          g.gain.setValueAtTime(0.09, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.098);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.105);
        },

        turnChime() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.085);
            g.gain.setValueAtTime(0.09, now + i * 0.085);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.085 + 0.22);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + i * 0.085);
            osc.stop(now + i * 0.085 + 0.24);
          });
        },

        winChord() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.095);
            g.gain.setValueAtTime(0.12, now + i * 0.095);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.095 + 0.42);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + i * 0.095);
            osc.stop(now + i * 0.095 + 0.44);
          });
        },

        error() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(195, now);
          osc.frequency.linearRampToValueAtTime(135, now + 0.12);
          g.gain.setValueAtTime(0.065, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        },

        const left = Number(t.left ?? t.leftVal ?? t.a ?? 0);
        const right = Number(t.right ?? t.rightVal ?? t.b ?? 0);
        const id = t.id || `${Math.min(left, right)}-${Math.max(left, right)}`;
        const isDouble = t.isDouble !== undefined ? Boolean(t.isDouble) : (t.is_double !== undefined ? Boolean(t.is_double) : left === right);
        return { id, left, right, a: left, b: right, isDouble, playedBySeat: t.playedBySeat ?? t.played_by_seat ?? null };
      }

      function normRoom(r) {
        if (!r) return null;
        const board = Array.isArray(r.board) ? r.board.map(normTile) : [];
        const ts = r.team_scores || r.teamScores || {};
        return {
          id: r.id,
          code: String(r.code || r.room_code || '').toUpperCase(),
          status: String(r.status || 'waiting').toLowerCase(),
          maxPlayers: Number(r.max_players ?? r.maxPlayers ?? 4),
          targetScore: Number(r.target_score ?? r.targetScore ?? 101),
          tieRule: r.tie_rule || r.tieRule || 'no_points',
          roundNumber: Number(r.round_number ?? r.roundNumber ?? 1),
          board,
          leftEnd: r.left_end ?? r.leftEnd ?? (board.length ? board[0].left : null),
          rightEnd: r.right_end ?? r.rightEnd ?? (board.length ? board[board.length - 1].right : null),
          drawPileCount: Number(r.draw_pile_count ?? r.drawPileCount ?? 0),
          currentTurnSeat: r.current_turn_seat ?? r.currentTurnSeat ?? null,
          currentTurnPlayerId: r.current_turn_player_id || r.currentTurnPlayerId || null,
          teamScores: {
            A: Number(ts.A ?? ts.a ?? r.team_a_score ?? 0),
            B: Number(ts.B ?? ts.b ?? r.team_b_score ?? 0),
          },
          lastAction: r.last_action || r.lastAction || null,
          roundResult: r.round_result || r.roundResult || null,
        };
      }

      function normPlayer(p, idx) {
        const seatIndex = Number(p.seat_index ?? p.seatIndex ?? idx);
        return {
          id: p.id,
          name: p.name || p.player_name || `لاعب ${seatIndex + 1}`,
          seatIndex,
          team: p.team || null,
          tileCount: Number(p.tile_count ?? p.tiles_count ?? p.tileCount ?? 0),
          score: Number(p.score ?? 0),
          isReady: Boolean(p.is_ready ?? p.isReady ?? false),
          isConnected: p.is_connected !== undefined ? Boolean(p.is_connected) : (p.isConnected !== undefined ? Boolean(p.isConnected) : true),
          isBot: Boolean(p.is_bot ?? p.isBot ?? false),
        };
      }

      function applyPrivateHandPayload(raw) {
        if (!raw) return;
        const tiles = Array.isArray(raw.tiles) ? raw.tiles.map(normTile) : [];
        const isMyTurn = Boolean(raw.isMyTurn ?? raw.is_my_turn ?? false);
        const canDraw = Boolean(raw.canDraw ?? raw.can_draw ?? false);
        const canPass = Boolean(raw.canPass ?? raw.can_pass ?? false);

        const validMoves = {};
        const vm = raw.validMoves ?? raw.valid_moves;
        if (Array.isArray(vm)) {
          vm.forEach((m) => {
            const tid = m.tileId || m.tile_id || m.id;
            if (!tid) return;
            if (Array.isArray(m.ends)) {
              validMoves[tid] = {
                canLeft: m.ends.includes('left') || m.ends.includes('LEFT'),
                canRight: m.ends.includes('right') || m.ends.includes('RIGHT'),
              };
            } else {
              validMoves[tid] = {
                canLeft: Boolean(m.canLeft ?? m.left),
                canRight: Boolean(m.canRight ?? m.right),
              };
            }
          });
        } else if (vm && typeof vm === 'object') {
          Object.keys(vm).forEach((tid) => {
            const entry = vm[tid];
            if (Array.isArray(entry)) {
              validMoves[tid] = { canLeft: entry.includes('left'), canRight: entry.includes('right') };
            } else if (entry && typeof entry === 'object') {
              validMoves[tid] = { canLeft: Boolean(entry.canLeft ?? entry.left), canRight: Boolean(entry.canRight ?? entry.right) };
            }
          });
        }

        store.privateState.tiles = tiles;
        store.privateState.validMoves = validMoves;
        store.privateState.isMyTurn = isMyTurn;
        store.privateState.canDraw = canDraw;
        store.privateState.canPass = canPass;

        if (!isMyTurn || !tiles.some((x) => x.id === store.privateState.selectedTileId)) {
          store.privateState.selectedTileId = null;
          store.privateState.selectedEnd = null;
        }
      }

      function wipePrivateState() {
        store.privateState.tiles = [];
        store.privateState.validMoves = {};
        store.privateState.isMyTurn = false;
        store.privateState.canDraw = false;
        store.privateState.canPass = false;
        store.privateState.selectedTileId = null;
        store.privateState.selectedEnd = null;
      }

      const realtimeService = {
        channel: null,
        roomId: null,
        fallbackInterval: null,

        subscribe(roomId, onUpdate) {
          if (this.roomId === roomId && this.channel) return;
          this.unsubscribe();
          this.roomId = roomId;

          this.channel = supabaseClient
            .channel(`domino-live-${roomId}`)
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` },
              () => onUpdate('rooms')
            )
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'room_players', filter: `room_id=eq.${roomId}` },
              () => onUpdate('room_players')
            )
            .subscribe((status) => {
              store.uiState.realtimeStatus = status;
              if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                store.uiState.isDisconnected = true;
                renderModals();
              }
              renderTopBar();
            });

          this.fallbackInterval = setInterval(() => {
            if (
              store.publicState.room &&
              store.uiState.realtimeStatus !== 'SUBSCRIBED' &&
              !store.uiState.isDisconnected
            ) {
              onUpdate('fallback_poll');
            }
          }, 4000);
        },

        unsubscribe() {
          if (this.fallbackInterval) {
            clearInterval(this.fallbackInterval);
            this.fallbackInterval = null;
          }
          if (this.channel) {
            try { supabaseClient.removeChannel(this.channel); } catch (e) {}
            this.channel = null;
          }
          this.roomId = null;
          store.uiState.realtimeStatus = 'IDLE';
        },
      };

      function t(key) {

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

      function copyText(text) {
        const ta = document.createElement('textarea');

        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
        document.body.appendChild(ta);

      function showToast(msg, tone = 'info') {
        const el = document.getElementById('toast-root');
        if (!el) return;
        if (toastTimerId) clearTimeout(toastTimerId);
        const style =
          tone === 'danger'
            ? 'bg-[#D95C5C] text-white border-white/25'
            : tone === 'gold'
            ? 'bg-[#D6B56D] text-[#0F352B] border-[#F5F0E5]/50'
            : 'bg-[#17463A] text-white border-[#D6B56D]/60';
        el.innerHTML = `<div class="anim-toast px-4 py-1.5 rounded-full text-xs font-extrabold shadow-xl border whitespace-nowrap ${style}">${esc(msg)}</div>`;
        toastTimerId = setTimeout(() => { el.innerHTML = ''; }, 2600);
      }

      function friendlyError(err) {
        const msg = String(err?.message || err?.details || err || '').toUpperCase();
        if (msg.includes('NOT_FOUND') || msg.includes('NOT FOUND')) return t('errNotFound');
        if (msg.includes('FULL')) return t('errFull');
        if (msg.includes('STARTED') || msg.includes('ALREADY')) return t('errStarted');
        return err?.message || t('errGeneral');
      }

      function getTurnPlayer() {
        const room = store.publicState.room;
        const players = store.publicState.players;
        if (!room || !players.length) return null;
        if (room.currentTurnPlayerId) {
          const p = players.find((x) => x.id === room.currentTurnPlayerId);
          if (p) return p;
        }
        if (room.currentTurnSeat !== null && room.currentTurnSeat !== undefined) {
          return players.find((x) => x.seatIndex === room.currentTurnSeat) || null;
        }
        return null;
      }

      function getInviteUrl(code) {
        const base = window.location.origin === 'null' ? '' : (window.location.origin + window.location.pathname);
        return base ? `${base}?join=${encodeURIComponent(code)}` : `?join=${encodeURIComponent(code)}`;
      }

      function fmtTimer(sec) {
        return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
      }

      function startRoundTimer() {
        stopRoundTimer();
        roundTimerId = setInterval(() => {
          if (store.publicState.room?.status === 'playing') {
            store.publicState.elapsedSeconds += 1;
            const el = document.getElementById('hud-timer');

      function stopRoundTimer() {

          clearInterval(roundTimerId);

        }
      }

      function startConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        stopConfetti();
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);
        canvas._onResize = resize;

        const colors = ['#D6B56D', '#F5F0E5', '#E8CE8E', '#34D399', '#C8A352'];
        const particles = Array.from({ length: 85 }).map(() => ({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.6,
          w: 6 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          vx: (Math.random() - 0.5) * 2.2,
          vy: 2.2 + Math.random() * 3.4,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.16,
          color: colors[Math.floor(Math.random() * colors.length)],
        }));

        const loop = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vrot;
            if (p.y > canvas.height + 20) {
              p.y = -15;
              p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
          confettiAnimId = requestAnimationFrame(loop);
        };
        confettiAnimId = requestAnimationFrame(loop);
      }

      function stopConfetti() {
        if (confettiAnimId) {
          cancelAnimationFrame(confettiAnimId);
          confettiAnimId = null;
        }
        const canvas = document.getElementById('confetti-canvas');
        if (canvas) {
          if (canvas._onResize) window.removeEventListener('resize', canvas._onResize);
          canvas.classList.add('hidden');
        }
      }

      // ======================================================================
      // 8. LIVE STATE SYNC & AUTO-BOT CONTROLLER
      // ======================================================================
      function screenForCurrentRoom() {
        const r = store.publicState.room;
        if (!r) return 'LANDING';
        if (r.status === 'waiting') return 'WAITING_ROOM';
        if (r.status === 'round_end') return 'ROUND_RESULTS';
        if (r.status === 'match_end') return 'MATCH_RESULTS';
        return store.uiState.role === 'TABLE' ? 'TABLE_BOARD' : 'PLAYER_SCREEN';
      }

      function scheduleAutoBot() {
        if (autoBotTimerId) clearTimeout(autoBotTimerId);
        const room = store.publicState.room;
        if (!store.uiState.autoBot || !store.uiState.hostToken || store.uiState.role !== 'TABLE' || room?.status !== 'playing') {
          if (store.uiState.botThinking) {
            store.uiState.botThinking = false;
            renderApp();
          }
          return;
        }
        const tp = getTurnPlayer();
        if (!tp || !tp.isBot) {
          store.uiState.botThinking = false;
          return;
        }

        store.uiState.botThinking = true;
        renderApp();

        autoBotTimerId = setTimeout(async () => {
          const curRoom = store.publicState.room;
          const curTp = getTurnPlayer();
          if (!store.uiState.autoBot || !store.uiState.hostToken || store.uiState.role !== 'TABLE' || curRoom?.status !== 'playing' || !curTp?.isBot) {
            store.uiState.botThinking = false;
            return;
          }
          try {
            await gameService.playBotTurn(curRoom.code, store.uiState.hostToken);
          } catch (e) {
            console.warn('Auto-bot skipped:', e);
          } finally {
            store.uiState.botThinking = false;
          }
        }, 1100);
      }

      async function syncLiveState({ navigate = true } = {}) {
        const code = store.publicState.room?.code || store.uiState.savedSession?.roomCode;
        if (!code) return;

        try {
          const { room, players } = await roomService.getRoomState(code);
          const prevStatus = store.publicState.lastStatus;
          const prevLen = store.publicState.lastBoardLen;
          const prevStamp = store.publicState.lastActionStamp;

          if (room.board.length > prevLen) {
            const end = String(room.lastAction?.end || room.lastAction?.side || 'right').toLowerCase();
            const newest = end === 'left' ? room.board[0] : room.board[room.board.length - 1];
            store.publicState.lastPlacedTileId = newest ? newest.id : null;
          } else if (room.board.length === 0) {
            store.publicState.lastPlacedTileId = null;
          }

          store.publicState.room = room;
          store.publicState.players = players;
          store.publicState.lastBoardLen = room.board.length;
          store.publicState.lastStatus = room.status;

          const act = room.lastAction;
          const stamp = act ? (act.timestamp || act.at || JSON.stringify(act)) : null;
          if (act && stamp && prevStamp !== null && stamp !== prevStamp) {
            const kind = String(act.type || '').toLowerCase();
            const who = act.playerName || act.player_name || '';
            if (kind === 'round_started' && act.startedByWinner) {
              const starter = players.find((p) => p.seatIndex === Number(act.seat));
              if (starter) showToast(`${starter.name} ${t('actWinnerStarts')}`, 'gold');
            } else if (kind.includes('play')) {
              audioEngine.clack();
              haptics.clack();
              const tileStr = act.tile ? `${act.tile.left ?? act.tile.a ?? ''}|${act.tile.right ?? act.tile.b ?? ''}` : '';
              if (who) showToast(`${who} ${t('actPlayed')} ${tileStr}`, 'info');
            } else if (kind.includes('draw')) {
              audioEngine.drawSwoosh();
              if (who) showToast(`${who} ${t('actDrew')}`, 'info');
            } else if (kind.includes('pass')) {
              audioEngine.tap();
              if (who) showToast(`${who} ${t('actPassed')}`, 'info');
            }
          }
          store.publicState.lastActionStamp = stamp;

          if (prevStatus !== room.status) {
            if (room.status === 'playing') {
              stopConfetti();
              store.publicState.elapsedSeconds = 0;
              startRoundTimer();
              audioEngine.turnChime();
            } else if (room.status === 'round_end') {
              stopRoundTimer();
              audioEngine.winChord();
              haptics.win();
            } else if (room.status === 'match_end') {
              stopRoundTimer();
              audioEngine.winChord();
              haptics.win();
              startConfetti();
            } else {
              stopRoundTimer();
              stopConfetti();
            }
          } else if (room.status === 'playing' && !roundTimerId) {
            startRoundTimer();
          }

          if (store.uiState.role === 'PLAYER' && store.privateState.activePlayerId) {
            const localRec = store.uiState.localPlayers[store.privateState.activePlayerId];
            if (localRec?.token && room.status === 'playing') {
              const wasMyTurn = store.privateState.isMyTurn;
              const handPayload = await playerService.getPlayerHand(room.code, store.privateState.activePlayerId, localRec.token);
              applyPrivateHandPayload(handPayload);
              if (store.privateState.isMyTurn && !wasMyTurn) {
                audioEngine.turnChime();
                haptics.tap();

            } else {

      // ======================================================================
      // 9. GRAPHICAL COMPONENTS (PIPS, 3D DOMINOES, QR CODE, CONNECTED SNAKE)
      // ======================================================================
      const PIP_MAP = {
        0: [],
        1: [[50, 50]],
        2: [[26, 26], [74, 74]],
        3: [[26, 26], [50, 50], [74, 74]],
        4: [[26, 26], [74, 26], [26, 74], [74, 74]],
        5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]],
        6: [[26, 22], [74, 22], [26, 50], [74, 50], [26, 78], [74, 78]],
      };

      function pipSvg(val) {
        const dots = (PIP_MAP[Number(val)] || [])
          .map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="11" fill="#20231F" />`)
          .join('');
        return `<svg viewBox="0 0 100 100" class="w-full h-full block" aria-hidden="true">${dots}</svg>`;
      }

      function dominoHtml({
        id = '',
        left = 0,
        right = 0,
        orientation = 'horizontal',
        size = 'md',
        exactPx = null,
        boardStyle = false,
        playable = false,
        selected = false,
        dimmed = false,
        isNew = false,
        interactive = false,
      }) {
        const horiz = orientation === 'horizontal';
        const dimMap = {
          xs: horiz ? 'w-11 h-6' : 'w-6 h-11',
          sm: horiz ? 'w-14 h-7 sm:w-16 sm:h-8' : 'w-7 h-14 sm:w-8 sm:h-16',
          md: horiz ? 'w-[64px] h-[33px] sm:w-[76px] sm:h-[38px]' : 'w-[33px] h-[64px] sm:w-[38px] sm:h-[76px]',
          lg: horiz ? 'w-24 h-12' : 'w-[58px] h-[112px]',
        };
        const divider = horiz
          ? 'w-[1.5px] h-[72%] bg-[#20231F]/30 rounded-full shrink-0'
          : 'h-[1.5px] w-[72%] bg-[#20231F]/30 rounded-full shrink-0';

        const cls = [
          'domino-tile',
          boardStyle ? 'board-tile' : '',
          horiz ? 'flex-row' : 'flex-col',
          exactPx ? '' : (dimMap[size] || dimMap.md),
          playable ? 'playable' : '',
          selected ? 'selected' : '',
          dimmed ? 'dimmed' : '',
          isNew ? 'anim-tile-drop' : '',
        ].filter(Boolean).join(' ');

        const inlineStyle = exactPx ? `style="width:${exactPx.w}px;height:${exactPx.h}px;"` : '';
        const tag = interactive ? 'button' : 'div';
        const attrs = interactive
          ? `type="button" data-action="select-tile" data-tile-id="${esc(id)}" aria-label="Domino ${left}-${right}"`
          : `aria-label="Domino ${left}-${right}"`;

        return `
          <${tag} ${attrs} ${inlineStyle} class="${cls}">
            ${isNew ? '<span class="domino-impact-ring"></span>' : ''}
            <div class="flex-1 w-full h-full flex items-center justify-center p-0.5">${pipSvg(left)}</div>
            <div class="${divider}"></div>
            <div class="flex-1 w-full h-full flex items-center justify-center p-0.5">${pipSvg(right)}</div>
          </${tag}>
        `;
      }

      function renderQrCode(text, pxSize = 128) {
        try {
          if (typeof window.qrcode === 'function') {
            const qr = window.qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            const count = qr.getModuleCount();
            let rects = '';
            for (let r = 0; r < count; r++) {
              for (let c = 0; c < count; c++) {
                if (qr.isDark(r, c)) {
                  rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#0F352B" />`;
                }
              }
            }
            return `
              <div class="bg-[#F5F0E5] p-2.5 rounded-2xl shadow-lg inline-flex items-center justify-center border border-[#D6B56D]/50">
                <svg viewBox="0 0 ${count} ${count}" width="${pxSize}" height="${pxSize}" shape-rendering="crispEdges">
                  <rect width="${count}" height="${count}" fill="#F5F0E5" />
                  ${rects}
                </svg>
              </div>
            `;
          }
        } catch (e) {
          console.warn('QR generation fallback:', e);
        }
        return `<div class="bg-[#F5F0E5] text-[#0F352B] font-mono font-black px-4 py-6 rounded-2xl text-sm">${esc(text)}</div>`;
      }

      function getSeatPlayer(pos) {
        const room = store.publicState.room;
        const players = store.publicState.players;
        if (!room || !players.length) return null;
        let idx = -1;
        if (room.maxPlayers === 2) {
          if (pos === 'BOTTOM') idx = 0;
          if (pos === 'TOP') idx = 1;
        } else if (room.maxPlayers === 3) {
          if (pos === 'BOTTOM') idx = 0;
          if (pos === 'LEFT') idx = 1;
          if (pos === 'TOP') idx = 2;
        } else {
          if (pos === 'BOTTOM') idx = 0;
          if (pos === 'RIGHT') idx = 1;
          if (pos === 'TOP') idx = 2;
          if (pos === 'LEFT') idx = 3;
        }
        return players.find((p) => p.seatIndex === idx) || null;
      }

      function computeConnectedSnakeLayout(board) {
        const UNIT = 34;
        const ROW_MAX_X = window.innerWidth < 640 ? 9 : 13;
        const ROW_MIN_X = 0;

        const placed = [];
        let dir = 'R';
        let cx = 0;
        let cy = 0;

        const collidesEarlier = (rect, margin = 0.14) => {
          for (let k = 0; k < placed.length - 1; k++) {
            const o = placed[k];
            if (
              rect.x < o.x + o.w + margin &&
              rect.x + rect.w + margin > o.x &&
              rect.y < o.y + o.h + margin &&
              rect.y + rect.h + margin > o.y
            ) {
              return true;
            }
          }
          return false;
        };

        for (let i = 0; i < board.length; i++) {
          const tile = board[i];
          const prev = placed.length > 0 ? placed[placed.length - 1] : null;
          let item = null;

          const needRightTurn = prev && dir === 'R' && cx >= ROW_MAX_X;
          const needLeftTurn = prev && dir === 'L' && cx <= ROW_MIN_X;

          if (needRightTurn) {
            const x = cx - 1;
            const y = prev.y + prev.h;
            item = {
              tile, x, y, w: 1, h: 2,
              orientation: 'vertical',
              dispA: tile.left,
              dispB: tile.right,
            };
            dir = 'L';
            cx = x;
            cy = y + 1.5;
          } else if (needLeftTurn) {
            const x = cx;
            const y = prev.y + prev.h;
            item = {
              tile, x, y, w: 1, h: 2,
              orientation: 'vertical',
              dispA: tile.left,
              dispB: tile.right,
            };
            dir = 'R';
            cx = x + 1;
            cy = y + 1.5;
          } else if (dir === 'R') {
            let usePerpDouble = tile.isDouble;
            if (usePerpDouble) {
              const cand = { x: cx, y: cy - 1, w: 1, h: 2 };
              if (collidesEarlier(cand)) usePerpDouble = false;
            }

            if (usePerpDouble) {
              item = {
                tile, x: cx, y: cy - 1, w: 1, h: 2,
                orientation: 'vertical',
                dispA: tile.left,
                dispB: tile.right,
              };
              cx += 1;
            } else {
              item = {
                tile, x: cx, y: cy - 0.5, w: 2, h: 1,
                orientation: 'horizontal',
                dispA: tile.left,
                dispB: tile.right,
              };
              cx += 2;
            }
          } else {
            let usePerpDouble = tile.isDouble;
            if (usePerpDouble) {
              const cand = { x: cx - 1, y: cy - 1, w: 1, h: 2 };
              if (collidesEarlier(cand)) usePerpDouble = false;
            }

            if (usePerpDouble) {
              item = {
                tile, x: cx - 1, y: cy - 1, w: 1, h: 2,
                orientation: 'vertical',
                dispA: tile.left,
                dispB: tile.right,
              };
              cx -= 1;
            } else {
              item = {
                tile, x: cx - 2, y: cy - 0.5, w: 2, h: 1,
                orientation: 'horizontal',
                dispA: tile.right,
                dispB: tile.left,
              };
              cx -= 2;
            }
          }

          placed.push(item);
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        placed.forEach((p) => {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x + p.w > maxX) maxX = p.x + p.w;
          if (p.y + p.h > maxY) maxY = p.y + p.h;
        });

        const widthPx = Math.max(1, (maxX - minX) * UNIT);
        const heightPx = Math.max(1, (maxY - minY) * UNIT);

        return {
          unit: UNIT,
          minX,
          minY,
          widthPx,
          heightPx,
          items: placed.map((p) => ({
            ...p,
            leftPx: (p.x - minX) * UNIT,
            topPx: (p.y - minY) * UNIT,
            wPx: p.w * UNIT,
            hPx: p.h * UNIT,
          })),
        };
      }

      function fitBoardSnake() {
        const vp = document.getElementById('board-viewport');
        const box = document.getElementById('board-snake-box');
        const stage = document.getElementById('board-snake-stage');
        if (!vp || !box || !stage) return;

        const baseW = Number(stage.dataset.w || 1);
        const baseH = Number(stage.dataset.h || 1);
        const availW = Math.max(80, vp.clientWidth - 16);
        const availH = Math.max(80, vp.clientHeight - 16);
        const scale = Math.min(1.22, availW / baseW, availH / baseH);

        box.style.width = `${Math.round(baseW * scale)}px`;
        box.style.height = `${Math.round(baseH * scale)}px`;
        stage.style.transform = `scale(${scale})`;
      }

      function renderBoardChain() {

        const layout = computeConnectedSnakeLayout(board);

                exactPx: { w: item.wPx, h: item.hPx },

              })}

          `;
        }).join('');

        return `

            <div id="board-viewport" class="flex-1 w-full min-h-0 flex items-center justify-center overflow-hidden">

                <div id="board-snake-stage" data-w="${layout.widthPx}" data-h="${layout.heightPx}"
                     style="position:absolute; top:0; left:0; width:${layout.widthPx}px; height:${layout.heightPx}px; transform-origin: top left;">

                <span class="font-mono font-extrabold text-[#D6B56D] tracking-widest bg-[#0C2B23] px-2 py-0.5 rounded-lg border border-[#235547]">
                  ${esc(room.code)}
                </span>
                <span class="text-[#B7C9C1]">${t('round')} <strong class="text-white">#${room.roundNumber}</strong></span>
                <span class="text-[#B7C9C1] hidden sm:inline">${t('target')}: <strong class="text-[#D6B56D]">${room.targetScore}</strong></span>
                <div class="hidden sm:flex items-center gap-1 font-mono text-[#B7C9C1] bg-[#0C2B23] px-2 py-0.5 rounded-lg border border-[#235547]">
                  <i data-lucide="clock" class="w-3 h-3 text-[#D6B56D]"></i>
                  <span id="hud-timer">${fmtTimer(store.publicState.elapsedSeconds)}</span>

              </div>

              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border text-xs font-extrabold ${
                anyOffline
                  ? 'bg-[#D95C5C]/20 text-[#ffd2d2] border-[#D95C5C]/50'
                  : 'bg-[#1A4B3E] text-[#D6B56D] border-[#D6B56D]/50'
              }">
                <span class="w-2 h-2 rounded-full bg-current animate-pulse"></span>
                <span>${anyOffline ? t('offlineWarn') : `${t('turnOf')} ${esc(tp?.name || '')}`}</span>
              </div>

              <div class="flex items-center gap-2">
                ${room.maxPlayers === 4 ? `
                  <div class="flex items-center gap-2 bg-[#0C2B23] px-2.5 py-1 rounded-xl border border-[#235547] text-xs font-extrabold">
                    <span class="text-[#D6B56D]">${t('teamA')}: ${room.teamScores.A}</span>
                    <span class="text-[#235547]">|</span>
                    <span class="text-white">${t('teamB')}: ${room.teamScores.B}</span>
                  </div>
                ` : ''}

                ${canManualBot ? `
                  <button type="button" data-action="bot-step" ${store.uiState.actionBusy ? 'disabled' : ''}
                    class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-[#D6B56D] hover:bg-[#E3C47E] text-[#0F352B] text-[11px] font-black active:scale-95">
                    <i data-lucide="bot" class="w-3.5 h-3.5"></i>
                    <span>${t('botStep')}</span>
                  </button>

            <div class="table-felt flex-1 relative rounded-2xl border border-[#235547] flex flex-col justify-between p-2 sm:p-3.5 overflow-hidden">
              <div class="flex items-center justify-center min-h-[48px] z-10 shrink-0">
                ${renderSeatBadge(getSeatPlayer('TOP'), 'TOP')}
              </div>

              <div class="flex-1 flex items-center justify-between gap-2 sm:gap-3 min-h-0 my-1">
                <div class="flex items-center justify-center shrink-0 z-10">
                  ${renderSeatBadge(getSeatPlayer('LEFT'), 'LEFT')}
                </div>

                <div class="flex-1 h-full flex items-center justify-center min-w-0 overflow-hidden">
                  ${renderBoardChain()}
                </div>

                <div class="flex items-center gap-2 shrink-0 z-10">
                  ${renderSeatBadge(getSeatPlayer('RIGHT'), 'RIGHT')}
                  ${renderDrawPile()}
                </div>
              </div>

              <div class="flex items-center justify-center min-h-[48px] z-10 shrink-0">

      // SCREEN 6: PRIVATE SMARTPHONE PLAYER SCREEN
      function renderPlayerGameScreen() {
        const room = store.publicState.room;
        const player = store.publicState.players.find((p) => p.id === store.privateState.activePlayerId);
        if (!room || !player) return '';

        const ps = store.privateState;
        const tp = getTurnPlayer();
        const is4P = room.maxPlayers === 4;
        const team = player.team || (player.seatIndex % 2 === 0 ? 'A' : 'B');
        const scoreVal = is4P ? (team === 'A' ? room.teamScores.A : room.teamScores.B) : player.score;

        const selTile = ps.tiles.find((x) => x.id === ps.selectedTileId) || null;
        const selMoves = selTile ? ps.validMoves[selTile.id] : null;
        const isBoardEmpty = room.board.length === 0;
        const matchesBoth = !isBoardEmpty && selMoves && selMoves.canLeft && selMoves.canRight && room.leftEnd !== room.rightEnd;

        let chosenEnd = ps.selectedEnd;
        if (selTile && selMoves) {
          if (isBoardEmpty) chosenEnd = 'right';
          else if (selMoves.canLeft && !selMoves.canRight) chosenEnd = 'left';
          else if (selMoves.canRight && !selMoves.canLeft) chosenEnd = 'right';
          else if (selMoves.canLeft && selMoves.canRight && room.leftEnd === room.rightEnd) chosenEnd = 'right';
        }

        const canPlay = Boolean(ps.isMyTurn && selTile && selMoves && chosenEnd && !store.uiState.actionBusy);

        let hint = `${t('waitingTurn')} ${tp?.name || ''}...`;
        if (ps.isMyTurn) {
          if (selTile) hint = matchesBoth && !chosenEnd ? t('hintPickEnd') : t('hintPressPlay');
          else if (Object.keys(ps.validMoves).length > 0) hint = isBoardEmpty ? t('emptyOpenAny') : t('hintSelect');
          else if (ps.canDraw) hint = room.maxPlayers === 2 ? t('hintDraw2') : t('hintDraw3');
          else if (ps.canPass) hint = t('hintPass');
        }

        const handHtml = ps.tiles.map((tile) => {
          const playable = ps.isMyTurn && Boolean(ps.validMoves[tile.id]);
          const selected = ps.selectedTileId === tile.id;
          return `
            <div class="snap-center shrink-0">
              ${dominoHtml({
                id: tile.id,
                left: tile.left,
                right: tile.right,
                orientation: 'vertical',
                size: 'lg',
                playable,
                selected,
                dimmed: ps.isMyTurn && !playable,
                interactive: true,
              })}
            </div>
          `;
        }).join('');

        return `
          <div class="anim-view h-full w-full flex items-center justify-center p-2 sm:p-4 overflow-hidden">
            <div class="w-full max-w-[430px] h-full sm:max-h-[780px] rounded-3xl bg-[#11392F]/95 border border-[#235547] shadow-2xl flex flex-col justify-between overflow-hidden">

              <div class="p-3.5 bg-[#0C2B23] border-b border-[#235547] flex flex-col gap-2.5 shrink-0">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-10 h-10 rounded-xl bg-[#D6B56D] text-[#0F352B] font-black flex items-center justify-center shrink-0">
                      ${esc(player.name.slice(0, 2).toUpperCase())}
                    </div>
                    <div class="min-w-0">
                      <div class="font-extrabold text-white text-sm truncate flex items-center gap-1.5">
                        <span>${esc(player.name)}</span>
                        ${is4P ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-[#1A4B3E] text-[#D6B56D] border border-[#2A6152]">${team === 'A' ? t('teamA') : t('teamB')}</span>` : ''}
                      </div>
                      <div class="text-[11px] text-[#B7C9C1] font-mono">
                        ${esc(room.code)} • ${t('round')} #${room.roundNumber}
                      </div>
                    </div>
                  </div>

                  <div class="flex flex-col items-end gap-0.5 shrink-0">
                    <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      !store.uiState.isDisconnected ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-[#D95C5C]/20 text-[#ffd2d2] border border-[#D95C5C]/40'
                    }">
                      <span class="w-1.5 h-1.5 rounded-full ${!store.uiState.isDisconnected ? 'bg-emerald-400' : 'bg-[#D95C5C]'}"></span>
                      ${!store.uiState.isDisconnected ? t('online') : t('offline')}
                    </span>
                    <span class="text-xs font-extrabold text-[#D6B56D]">${t('score')}: ${scoreVal}/${room.targetScore}</span>
                  </div>
                </div>

                <div class="w-full py-2 px-3 rounded-xl text-center text-xs sm:text-sm font-extrabold flex items-center justify-center gap-2 ${
                  ps.isMyTurn ? 'bg-[#D6B56D] text-[#0F352B] anim-turn-halo' : 'bg-[#11392F] text-[#B7C9C1] border border-[#235547]'
                }">
                  <i data-lucide="hand" class="w-4 h-4"></i>
                  <span>${ps.isMyTurn ? t('yourTurn') : `${t('turnOf')} ${esc(tp?.name || '')}`}</span>
                </div>
              </div>

              <div class="px-3.5 pt-2.5 shrink-0">
                <div class="rounded-2xl bg-[#0C2B23] border border-[#235547] p-2.5">
                  ${isBoardEmpty ? `
                    <div class="text-center text-xs font-bold text-[#D6B56D] py-1.5">${t('emptyOpenAny')}</div>
                  ` : `
                    <div dir="ltr" class="grid grid-cols-3 items-center gap-2 text-center">
                      <button type="button" data-action="pick-end" data-end="left" ${!selMoves?.canLeft ? 'disabled' : ''}
                        class="flex flex-col items-center p-1.5 rounded-xl border transition-all active:scale-95 ${
                          selMoves?.canLeft
                            ? (chosenEnd === 'left' ? 'bg-[#D6B56D] text-[#0F352B] border-[#F5F0E5]' : 'bg-[#1A5142] text-white border-[#D6B56D] anim-end-pulse cursor-pointer')
                            : 'bg-[#11392F] text-white border-[#235547] opacity-80'
                        }">
                        <span class="text-[10px] font-bold opacity-80">${t('leftEnd')}</span>
                        <div class="w-7 h-7 my-0.5 rounded-lg bg-[#F5F0E5] p-0.5 shadow-inner">${pipSvg(room.leftEnd)}</div>
                      </button>

                      <div class="flex flex-col items-center gap-0.5 text-[11px] text-[#B7C9C1]">
                        <span class="font-bold text-white">${room.board.length} ${t('onBoard')}</span>
                        ${room.maxPlayers !== 4 ? `<span class="text-[10px] font-bold text-[#D6B56D]">${t('drawPile')}: ${room.drawPileCount}</span>` : ''}
                      </div>

                      <button type="button" data-action="pick-end" data-end="right" ${!selMoves?.canRight ? 'disabled' : ''}
                        class="flex flex-col items-center p-1.5 rounded-xl border transition-all active:scale-95 ${
                          selMoves?.canRight
                            ? (chosenEnd === 'right' ? 'bg-[#D6B56D] text-[#0F352B] border-[#F5F0E5]' : 'bg-[#1A5142] text-white border-[#D6B56D] anim-end-pulse cursor-pointer')
                            : 'bg-[#11392F] text-white border-[#235547] opacity-80'
                        }">
                        <span class="text-[10px] font-bold opacity-80">${t('rightEnd')}</span>
                        <div class="w-7 h-7 my-0.5 rounded-lg bg-[#F5F0E5] p-0.5 shadow-inner">${pipSvg(room.rightEnd)}</div>
                      </button>
                    </div>
                  `}
                </div>
              </div>

              <div class="flex-1 flex flex-col justify-center px-3.5 py-1 min-h-0">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold text-[#B7C9C1]">${t('privateHand')} (${ps.tiles.length})</span>
                  ${selTile ? `<span class="text-xs font-mono font-black text-[#D6B56D]">[${selTile.left} | ${selTile.right}]</span>` : ''}
                </div>

                ${matchesBoth ? `
                  <div class="mb-1.5 flex items-center justify-between gap-2 bg-[#17463A] border border-[#D6B56D] rounded-xl px-3 py-1.5 shadow-lg">
                    <span class="text-[11px] font-bold text-[#F5F0E5]">${t('chooseEnd')}</span>
                    <div dir="ltr" class="flex items-center gap-1.5">
                      <button type="button" data-action="pick-end" data-end="left"
                        class="px-2.5 py-1 rounded-lg text-xs font-extrabold active:scale-95 ${
                          chosenEnd === 'left' ? 'bg-[#D6B56D] text-[#0F352B]' : 'bg-[#0C2B23] text-white border border-[#2A6152]'
                        }">
                        ← ${room.leftEnd}
                      </button>
                      <button type="button" data-action="pick-end" data-end="right"
                        class="px-2.5 py-1 rounded-lg text-xs font-extrabold active:scale-95 ${
                          chosenEnd === 'right' ? 'bg-[#D6B56D] text-[#0F352B]' : 'bg-[#0C2B23] text-white border border-[#2A6152]'
                        }">
                        ${room.rightEnd} →
                      </button>
                    </div>
                  </div>
                ` : ''}

                <div class="w-full overflow-x-auto snap-x snap-mandatory no-scrollbar pb-3 pt-5">
                  <div class="flex items-center gap-3 w-max mx-auto px-3">${handHtml}</div>
                </div>
              </div>

              <div class="p-3.5 bg-[#0C2B23] border-t border-[#235547] flex flex-col gap-2 shrink-0" style="padding-bottom: max(0.875rem, env(safe-area-inset-bottom));">
                <p class="text-[11px] text-center text-[#B7C9C1] min-h-[16px]">${esc(hint)}</p>

                <div class="flex items-center gap-2">
                  <button type="button" data-action="play-selected" data-end="${chosenEnd || ''}" ${!canPlay ? 'disabled' : ''}
                    class="btn-gold flex-1 py-3.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2">
                    <i data-lucide="${store.uiState.actionBusy ? 'loader-2' : 'play'}" class="w-4 h-4 ${store.uiState.actionBusy ? 'animate-spin' : ''}"></i>
                    <span>${t('playTile')}</span>
                  </button>

                  ${ps.canDraw ? `
                    <button type="button" data-action="draw-tile" ${store.uiState.actionBusy ? 'disabled' : ''}
                      class="py-3.5 px-4 rounded-xl bg-[#1A5142] hover:bg-[#236654] border border-[#D6B56D] text-[#D6B56D] font-extrabold text-sm flex items-center justify-center gap-1.5 active:scale-95">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                      <span>${t('drawTile')}</span>
                    </button>
                  ` : ''}

                  ${ps.canPass ? `
                    <button type="button" data-action="pass-turn" ${store.uiState.actionBusy ? 'disabled' : ''}
                      class="py-3.5 px-4 rounded-xl bg-[#D95C5C] hover:bg-[#e56d6d] text-white font-extrabold text-sm flex items-center justify-center gap-1.5 active:scale-95">
                      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                      <span>${t('passTurn')}</span>
                    </button>
                  ` : ''}
                </div>
              </div>

            </div>
          </div>
        `;
      }

      // SCREEN 8: ROUND RESULTS
      function renderRoundResultsScreen() {
        const room = store.publicState.room;
        if (!room) return '';
        const res = room.roundResult || {};
        const isHost = Boolean(store.uiState.hostToken);
        const isTie = Boolean(res.isTie || res.is_tie || String(res.winnerType || '').toUpperCase() === 'TIE');
        const blocked = String(res.reason || '').toLowerCase().includes('block');
        const pts = Number(res.pointsAwarded ?? res.points_awarded ?? 0);

        const winnerTeam = res.winnerTeam || res.winner_team || null;
        let wName = res.winnerName || res.winner_name || '';
        if (room.maxPlayers === 4 && winnerTeam) {
          wName = String(winnerTeam).toUpperCase() === 'A' ? t('teamA') : t('teamB');
        }

        const revealed = res.revealedHands || res.revealed_hands || [];
        const remPips = res.remainingPips || res.remaining_pips || {};

        const handsHtml = store.publicState.players.map((p) => {
          let rawTiles = [];
          let sum = 0;

          if (Array.isArray(revealed)) {
            const entry = revealed.find((h) => h.playerId === p.id || Number(h.seatIndex) === p.seatIndex);
            rawTiles = Array.isArray(entry?.tiles) ? entry.tiles : [];
            sum = entry?.pips !== undefined ? Number(entry.pips) : rawTiles.reduce((a, b) => a + Number(b.a ?? b.left ?? 0) + Number(b.b ?? b.right ?? 0), 0);
          } else if (revealed && typeof revealed === 'object') {
            const entry = revealed[p.id] || revealed[String(p.seatIndex)] || [];
            rawTiles = Array.isArray(entry) ? entry : (Array.isArray(entry?.tiles) ? entry.tiles : []);
            sum = remPips[p.id] !== undefined ? Number(remPips[p.id]) : rawTiles.reduce((a, b) => a + Number(b.a ?? b.left ?? 0) + Number(b.b ?? b.right ?? 0), 0);
          }

          const tiles = rawTiles.map(normTile);
          const teamLabel = room.maxPlayers === 4 ? (p.team === 'A' || p.seatIndex % 2 === 0 ? t('teamA') : t('teamB')) : null;

          return `
            <div class="flex flex-wrap items-center justify-between gap-2 bg-[#11392F] px-3 py-2 rounded-xl border border-[#235547]">
              <div class="flex items-center gap-2">
                <span class="font-bold text-xs sm:text-sm text-white">${esc(p.name)}</span>
                ${teamLabel ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-[#0C2B23] text-[#B7C9C1]">${teamLabel}</span>` : ''}
                <span class="text-xs text-[#D6B56D] font-bold">(${sum} ${t('pips')})</span>
              </div>
              <div class="flex items-center gap-1 flex-wrap">
                ${tiles.length === 0
                  ? `<span class="text-xs text-emerald-400 font-bold">0 ${t('tilesLeft')}</span>`
                  : tiles.map((tile) => dominoHtml({ left: tile.left, right: tile.right, orientation: 'horizontal', size: 'xs' })).join('')
                }
              </div>
            </div>
          `;
        }).join('');

        const teamBlockedSummary = (room.maxPlayers === 4 && blocked && res.teamAPips !== undefined && res.teamBPips !== undefined) ? `
          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="bg-[#0C2B23] border ${winnerTeam === 'A' ? 'border-[#D6B56D]' : 'border-[#235547]'} rounded-xl py-2 px-3">
              <div class="text-[11px] text-[#B7C9C1]">${t('teamA')}</div>
              <div class="text-sm font-black text-white">${res.teamAPips} ${t('pips')}</div>
            </div>
            <div class="bg-[#0C2B23] border ${winnerTeam === 'B' ? 'border-[#D6B56D]' : 'border-[#235547]'} rounded-xl py-2 px-3">
              <div class="text-[11px] text-[#B7C9C1]">${t('teamB')}</div>
              <div class="text-sm font-black text-white">${res.teamBPips} ${t('pips')}</div>
            </div>
          </div>
        ` : '';

        const scoresHtml = room.maxPlayers === 4
          ? [{ l: t('teamA'), s: room.teamScores.A }, { l: t('teamB'), s: room.teamScores.B }].map((tm) => `
              <div class="bg-[#0C2B23] p-3 rounded-xl border border-[#235547]">
                <div class="flex justify-between text-xs sm:text-sm font-extrabold text-white mb-1.5">
                  <span>${tm.l}</span>
                  <span class="text-[#D6B56D]">${tm.s} / ${room.targetScore}</span>
                </div>
                <div class="w-full h-2 rounded-full bg-[#11392F] overflow-hidden">
                  <div style="width:${Math.min(100, Math.round((tm.s / room.targetScore) * 100))}%" class="h-full bg-[#D6B56D] rounded-full"></div>
                </div>
              </div>
            `).join('')
          : store.publicState.players.map((p) => `
              <div class="bg-[#0C2B23] p-3 rounded-xl border border-[#235547]">
                <div class="flex justify-between text-xs sm:text-sm font-extrabold text-white mb-1.5">
                  <span class="truncate">${esc(p.name)}</span>
                  <span class="text-[#D6B56D]">${p.score}</span>
                </div>
                <div class="w-full h-2 rounded-full bg-[#11392F] overflow-hidden">
                  <div style="width:${Math.min(100, Math.round((p.score / room.targetScore) * 100))}%" class="h-full bg-[#D6B56D] rounded-full"></div>
                </div>
              </div>
            `).join('');

        return `
          <div class="anim-view h-full w-full px-4 py-3 flex items-center justify-center overflow-hidden">
            <div class="w-full max-w-2xl max-h-full overflow-y-auto app-scroll rounded-3xl bg-[#11392F]/95 border border-[#D6B56D]/60 p-5 sm:p-6 shadow-2xl flex flex-col gap-4">
              <div class="text-center">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1A4B3E] border border-[#2A6152] text-[11px] font-bold text-[#D6B56D] mb-1.5">
                  ${t('round')} #${room.roundNumber} — ${t('roundResults')}
                </span>
                <h2 class="text-2xl sm:text-3xl font-black text-white">
                  ${isTie ? t('roundTie') : `${t('roundWinner')}: ${esc(wName)}`}
                </h2>
                <p class="text-xs text-[#B7C9C1] mt-1">${blocked ? t('reasonBlocked') : t('reasonDomino')}</p>
                ${pts > 0 ? `<div class="mt-2.5 inline-flex px-4 py-1 rounded-xl bg-[#D6B56D]/20 border border-[#D6B56D] text-[#D6B56D] text-sm font-extrabold">+${pts} ${t('pts')}</div>` : ''}
              </div>

              ${teamBlockedSummary}

              <div class="bg-[#0C2B23] rounded-2xl p-3.5 border border-[#235547]">
                <h4 class="text-xs font-bold text-[#B7C9C1] mb-2.5">${t('revealedHands')}</h4>
                <div class="flex flex-col gap-2">${handsHtml}</div>
              </div>

              <div class="flex flex-col gap-2">
                <h4 class="text-xs font-bold text-[#B7C9C1]">${t('scoreboard')} (${t('target')}: ${room.targetScore})</h4>
                <div class="grid ${room.maxPlayers === 4 ? 'grid-cols-2' : 'grid-cols-1 sm:grid-cols-3'} gap-2">${scoresHtml}</div>
              </div>

              ${isHost ? `
                <button type="button" data-action="next-round" ${store.uiState.actionBusy ? 'disabled' : ''}
                  class="btn-gold w-full py-3.5 px-5 rounded-xl text-sm flex items-center justify-center gap-2">
                  <i data-lucide="${store.uiState.actionBusy ? 'loader-2' : 'play'}" class="w-4 h-4 ${store.uiState.actionBusy ? 'animate-spin' : ''}"></i>
                  <span>${t('nextRound')}</span>
                </button>
              ` : `
                <div class="text-center text-xs font-bold text-[#B7C9C1] py-2.5 bg-[#0C2B23] rounded-xl border border-[#235547]">
                  ${t('waitingHostNext')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      // SCREEN 9: MATCH RESULTS
      function renderMatchResultsScreen() {
        const room = store.publicState.room;
        if (!room) return '';
        const isHost = Boolean(store.uiState.hostToken);
        const is4P = room.maxPlayers === 4;
        const standings = is4P
          ? [{ name: t('teamA'), score: room.teamScores.A }, { name: t('teamB'), score: room.teamScores.B }].sort((a, b) => b.score - a.score)
          : [...store.publicState.players].sort((a, b) => b.score - a.score);
        const champ = standings[0]?.name || '';

        return `
          <div class="anim-view h-full w-full px-4 py-4 flex items-center justify-center overflow-hidden">
