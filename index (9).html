        if (sil) {
          sil.style.display = (store.uiState.screen === 'TABLE_BOARD' || store.uiState.screen === 'PLAYER_SCREEN') ? 'none' : 'block';
        }

        renderTopBar();

        const main = document.getElementById('app-main');
        if (!main) return;

        let html = '';
        switch (store.uiState.screen) {
          case 'LANDING': html = renderLandingScreen(); break;
          case 'CREATE_ROOM': html = renderCreateRoomScreen(); break;
          case 'JOIN_ROOM': html = renderJoinRoomScreen(); break;
          case 'WAITING_ROOM': html = renderWaitingRoomScreen(); break;
          case 'TABLE_BOARD': html = renderTabletBoardScreen(); break;
          case 'PLAYER_SCREEN': html = renderPlayerGameScreen(); break;
          case 'ROUND_RESULTS': html = renderRoundResultsScreen(); break;
          case 'MATCH_RESULTS': html = renderMatchResultsScreen(); break;
          default: html = renderLandingScreen();
        }
        main.innerHTML = html;

        const bindForm = (formId, codeId, nameId) => {
          const form = document.getElementById(formId);
          if (!form) return;
          const ci = document.getElementById(codeId);
          const ni = document.getElementById(nameId);
          ci.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
            store.uiState.joinDraft.code = e.target.value;
          });
          ni.addEventListener('input', (e) => {
            store.uiState.joinDraft.name = e.target.value;
          });
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await submitJoinRoom();
          });
        };
        bindForm('inline-join-form', 'inline-code', 'inline-name');
        bindForm('dedicated-join-form', 'ded-code', 'ded-name');

        renderModals();
        lucide.createIcons();

        if (store.uiState.screen === 'TABLE_BOARD') {
          requestAnimationFrame(fitBoardSnake);
        }
      }

      // ======================================================================
      // 11. ASYNC ACTIONS & EVENT DELEGATION
      // ======================================================================
      async function handleInstallClick() {
        audioEngine.tap();
        haptics.tap();
        store.uiState.settingsOpen = false;
        store.uiState.simOpen = false;

        if (deferredInstallPrompt) {
          try {
            deferredInstallPrompt.prompt();
            const choice = await deferredInstallPrompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              deferredInstallPrompt = null;
              store.uiState.isStandalone = true;
              audioEngine.winChord();
              haptics.win();
              showToast(t('installedDone'), 'gold');
            }
          } catch (err) {
            store.uiState.installModalOpen = true;
          }
          renderApp();
          return;
        }

        // iOS Safari or browsers without beforeinstallprompt -> show clean instructions sheet
        store.uiState.installModalOpen = true;
        renderApp();
      }

      async function submitCreateRoom() {
        if (store.uiState.loading) return;
        store.uiState.loading = true;
        renderApp();
        try {
          const d = store.uiState.createDraft;
          const { room, hostToken } = await roomService.createRoom(d.maxPlayers, d.targetScore, d.tieRule);
          store.publicState.room = room;
          store.publicState.players = [];
          store.uiState.hostToken = hostToken;
          store.uiState.role = 'TABLE';
          store.privateState.activePlayerId = null;
          store.uiState.localPlayers = {};
          wipePrivateState();
          store.uiState.screen = 'WAITING_ROOM';
          audioEngine.turnChime();
          haptics.tap();
          saveSession();
          await syncLiveState({ navigate: true });
        } catch (err) {
          audioEngine.error();
          haptics.error();
          showToast(friendlyError(err), 'danger');
        } finally {
          store.uiState.loading = false;
          renderApp();
        }
      }

      async function submitJoinRoom() {
        if (store.uiState.loading) return;
        store.uiState.joinDraft.error = '';
        store.uiState.loading = true;
        renderApp();
        try {
          const { room, player, playerToken } = await playerService.joinRoom(
            store.uiState.joinDraft.code,
            store.uiState.joinDraft.name,
            false
          );
          store.publicState.room = room;
          store.uiState.role = 'PLAYER';
          store.privateState.activePlayerId = player.id;
          store.uiState.localPlayers[player.id] = {
            id: player.id,
            name: player.name,
            seatIndex: player.seatIndex,
            token: playerToken,
            isBot: false,
          };
          audioEngine.turnChime();
          haptics.tap();
          store.uiState.screen = screenForCurrentRoom();
          saveSession();
          await syncLiveState({ navigate: true });
        } catch (err) {
          audioEngine.error();
          haptics.error();
          store.uiState.joinDraft.error = friendlyError(err);
        } finally {
          store.uiState.loading = false;
          renderApp();
        }
      }

      async function addPlayerIntoRoom(isBot) {
        const room = store.publicState.room;
        if (!room || store.uiState.actionBusy) return;
        store.uiState.actionBusy = true;
        renderApp();
        try {
          const pool = isBot ? BOT_NAMES[store.uiState.lang] : TEST_HUMAN_NAMES[store.uiState.lang];
          const used = new Set(store.publicState.players.map((p) => p.name));
          const nextName = pool.find((n) => !used.has(n)) || (isBot ? `بوت ${store.publicState.players.length + 1}` : `لاعب ${store.publicState.players.length + 1}`);
          const { player, playerToken } = await playerService.joinRoom(room.code, nextName, isBot);
          store.uiState.localPlayers[player.id] = {
            id: player.id,
            name: player.name,
            seatIndex: player.seatIndex,
            token: playerToken,
            isBot,
          };
          audioEngine.tap();
          haptics.tap();
          saveSession();
          await syncLiveState({ navigate: false });
        } catch (err) {
          audioEngine.error();
          showToast(friendlyError(err), 'danger');
        } finally {
          store.uiState.actionBusy = false;
          renderApp();
        }
      }

      async function updateRoomSettingsLive(patch) {
        const room = store.publicState.room;
        if (!room || !store.uiState.hostToken) return;
        store.uiState.actionBusy = true;
        try {
          await roomService.updateSettings(room.code, store.uiState.hostToken, {
            maxPlayers: patch.maxPlayers ?? room.maxPlayers,
            targetScore: patch.targetScore ?? room.targetScore,
            tieRule: patch.tieRule ?? room.tieRule,
          });
          audioEngine.tap();
          showToast(t('settingsSaved'), 'gold');
          await syncLiveState({ navigate: false });
        } catch (err) {
          audioEngine.error();
          showToast(friendlyError(err), 'danger');
        } finally {
          store.uiState.actionBusy = false;
          renderApp();
        }
      }

      async function performReconnect() {
        store.uiState.reconnecting = true;
        renderModals();
        try {
          const room = store.publicState.room;
          const pid = store.privateState.activePlayerId;
          if (room && pid && store.uiState.localPlayers[pid]?.token) {
            await playerService.setConnection(room.code, pid, store.uiState.localPlayers[pid].token, true);
          }
          realtimeService.unsubscribe();
          await syncLiveState({ navigate: true });
          store.uiState.isDisconnected = false;
          audioEngine.turnChime();
          haptics.tap();
        } catch (err) {
          audioEngine.error();
          showToast(friendlyError(err), 'danger');
        } finally {
          store.uiState.reconnecting = false;
          renderApp();
        }
      }

      document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const action = el.getAttribute('data-action');

        switch (action) {
          case 'trigger-install': {
            await handleInstallClick();
            break;
          }

          case 'brand-home': {
            audioEngine.tap();
            haptics.tap();
            if (store.publicState.room && !['LANDING', 'CREATE_ROOM', 'JOIN_ROOM'].includes(store.uiState.screen)) {
              store.uiState.confirmHomeOpen = true;
              renderModals();
            } else {
              store.uiState.screen = 'LANDING';
              renderApp();
            }
            break;
          }

          case 'go-landing':
          case 'confirm-home': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.confirmHomeOpen = false;
            store.uiState.screen = 'LANDING';
            renderApp();
            break;
          }

          case 'set-landing-tab': {
            const tab = el.getAttribute('data-tab');
            if (tab !== store.uiState.landingTab) {
              audioEngine.tap();
              haptics.tap();
              store.uiState.landingTab = tab;
              store.uiState.joinDraft.error = '';
              renderApp();
            }
            break;
          }

          case 'resume-saved': {
            audioEngine.tap();
            haptics.tap();
            const saved = loadSession();
            if (saved?.roomCode) {
              store.uiState.hostToken = saved.hostToken || null;
              store.uiState.role = saved.role || 'TABLE';
              store.privateState.activePlayerId = saved.activePlayerId || null;
              store.uiState.localPlayers = saved.localPlayers || {};
              store.uiState.screen = 'WAITING_ROOM';
              await syncLiveState({ navigate: true });
            }
            break;
          }

          case 'go-create': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.screen = 'CREATE_ROOM';
            renderApp();
            break;
          }

          case 'open-settings': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.simOpen = false;
            store.uiState.installModalOpen = false;
            store.uiState.settingsOpen = true;
            renderApp();
            break;
          }

          case 'open-sim': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.settingsOpen = false;
            store.uiState.installModalOpen = false;
            store.uiState.simOpen = true;
            renderApp();
            break;
          }

          case 'close-modals': {
            audioEngine.tap();
            store.uiState.settingsOpen = false;
            store.uiState.simOpen = false;
            store.uiState.confirmHomeOpen = false;
            store.uiState.installModalOpen = false;
            renderApp();
            break;
          }

          case 'open-confirm-home': {
            audioEngine.tap();
            store.uiState.confirmHomeOpen = true;
            renderModals();
            break;
          }

          case 'toggle-lang': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.lang = store.uiState.lang === 'ar' ? 'en' : 'ar';
            applyDir();
            savePrefs();
            renderApp();
            break;
          }

          case 'toggle-sound': {
            store.uiState.soundEnabled = !store.uiState.soundEnabled;
            audioEngine.enabled = store.uiState.soundEnabled;
            if (store.uiState.soundEnabled) audioEngine.tap();
            savePrefs();
            renderModals();
            break;
          }

          case 'toggle-haptics': {
            store.uiState.hapticsEnabled = !store.uiState.hapticsEnabled;
            haptics.enabled = store.uiState.hapticsEnabled;
            if (store.uiState.hapticsEnabled) haptics.tap();
            audioEngine.tap();
            savePrefs();
            renderModals();
            break;
          }

          case 'toggle-autobot': {
            audioEngine.tap();
            store.uiState.autoBot = !store.uiState.autoBot;
            savePrefs();
            renderModals();
            scheduleAutoBot();
            break;
          }

          case 'draft-players': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.createDraft.maxPlayers = Number(el.getAttribute('data-val'));
            renderApp();
            break;
          }

          case 'draft-target': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.createDraft.targetScore = Number(el.getAttribute('data-val'));
            renderApp();
            break;
          }

          case 'draft-tie': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.createDraft.tieRule = el.getAttribute('data-val');
            renderApp();
            break;
          }

          case 'submit-create': {
            await submitCreateRoom();
            break;
          }

          case 'set-target-live': {
            const v = Number(el.getAttribute('data-val'));
            store.uiState.createDraft.targetScore = v;
            if (store.publicState.room && store.uiState.hostToken) await updateRoomSettingsLive({ targetScore: v });
            else { audioEngine.tap(); renderModals(); }
            break;
          }

          case 'set-tie-live': {
            const v = el.getAttribute('data-val');
            store.uiState.createDraft.tieRule = v;
            if (store.publicState.room && store.uiState.hostToken) await updateRoomSettingsLive({ tieRule: v });
            else { audioEngine.tap(); renderModals(); }
            break;
          }

          case 'host-set-players': {
            await updateRoomSettingsLive({ maxPlayers: Number(el.getAttribute('data-val')) });
            break;
          }

          case 'copy-code': {
            if (!store.publicState.room) break;
            audioEngine.tap();
            haptics.tap();
            copyText(store.publicState.room.code);
            showToast(t('copied'), 'gold');
            break;
          }

          case 'copy-link': {
            if (!store.publicState.room) break;
            audioEngine.tap();
            haptics.tap();
            copyText(getInviteUrl(store.publicState.room.code));
            showToast(t('copied'), 'gold');
            break;
          }

          case 'add-bot': {
            await addPlayerIntoRoom(true);
            break;
          }

          case 'add-local-human': {
            await addPlayerIntoRoom(false);
            break;
          }

          case 'toggle-ready': {
            const room = store.publicState.room;
            const pid = store.privateState.activePlayerId;
            const rec = pid && store.uiState.localPlayers[pid];
            if (!room || !rec?.token || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              await playerService.toggleReady(room.code, pid, rec.token);
              audioEngine.tap();
              haptics.tap();
              await syncLiveState({ navigate: false });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'start-match': {
            const room = store.publicState.room;
            if (!room || !store.uiState.hostToken || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              await gameService.startGame(room.code, store.uiState.hostToken);
              haptics.tap();
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'bot-step': {
            const room = store.publicState.room;
            if (!room || !store.uiState.hostToken || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              await gameService.playBotTurn(room.code, store.uiState.hostToken);
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'select-tile': {
            const ps = store.privateState;
            if (!ps.isMyTurn) break;
            const tid = el.getAttribute('data-tile-id');
            if (!ps.validMoves[tid]) {
              audioEngine.error();
              haptics.error();
              showToast(t('invalidTile'), 'danger');
              break;
            }
            audioEngine.tap();
            haptics.tap();
            if (ps.selectedTileId === tid) {
              ps.selectedTileId = null;
              ps.selectedEnd = null;
            } else {
              ps.selectedTileId = tid;
              const mv = ps.validMoves[tid];
              const room = store.publicState.room;
              if (!room.board.length) ps.selectedEnd = 'right';
              else if (mv.canLeft && !mv.canRight) ps.selectedEnd = 'left';
              else if (mv.canRight && !mv.canLeft) ps.selectedEnd = 'right';
              else if (room.leftEnd === room.rightEnd) ps.selectedEnd = 'right';
              else ps.selectedEnd = null;
            }
            renderApp();
            break;
          }

          case 'pick-end': {
            const end = el.getAttribute('data-end');
            if (!store.privateState.selectedTileId || !store.privateState.validMoves[store.privateState.selectedTileId]) break;
            audioEngine.tap();
            haptics.tap();
            store.privateState.selectedEnd = end;
            renderApp();
            break;
          }

          case 'play-selected': {
            const room = store.publicState.room;
            const ps = store.privateState;
            const rec = ps.activePlayerId && store.uiState.localPlayers[ps.activePlayerId];
            if (!room || !rec?.token || !ps.selectedTileId || store.uiState.actionBusy) break;
            const end = el.getAttribute('data-end') || ps.selectedEnd || 'right';
            store.uiState.actionBusy = true;
            renderApp();
            try {
              const payload = await gameService.playTile(room.code, ps.activePlayerId, rec.token, ps.selectedTileId, end);
              audioEngine.clack();
              haptics.clack();
              ps.selectedTileId = null;
              ps.selectedEnd = null;
              if (payload && payload.tiles) applyPrivateHandPayload(payload);
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              haptics.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'draw-tile': {
            const room = store.publicState.room;
            const ps = store.privateState;
            const rec = ps.activePlayerId && store.uiState.localPlayers[ps.activePlayerId];
            if (!room || !rec?.token || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              const payload = await gameService.drawTile(room.code, ps.activePlayerId, rec.token);
              audioEngine.drawSwoosh();
              haptics.tap();
              if (payload && payload.tiles) applyPrivateHandPayload(payload);
              if (payload && payload.autoPassed) showToast(t('autoPassedMsg'), 'info');
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'pass-turn': {
            const room = store.publicState.room;
            const ps = store.privateState;
            const rec = ps.activePlayerId && store.uiState.localPlayers[ps.activePlayerId];
            if (!room || !rec?.token || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              const payload = await gameService.passTurn(room.code, ps.activePlayerId, rec.token);
              audioEngine.tap();
              haptics.tap();
              if (payload && payload.tiles) applyPrivateHandPayload(payload);
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'next-round': {
            const room = store.publicState.room;
            if (!room || !store.uiState.hostToken || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              await gameService.startNextRound(room.code, store.uiState.hostToken);
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'rematch': {
            const room = store.publicState.room;
            if (!room || !store.uiState.hostToken || store.uiState.actionBusy) break;
            store.uiState.actionBusy = true;
            renderApp();
            try {
              await gameService.rematch(room.code, store.uiState.hostToken);
              await syncLiveState({ navigate: true });
            } catch (err) {
              audioEngine.error();
              showToast(friendlyError(err), 'danger');
            } finally {
              store.uiState.actionBusy = false;
              renderApp();
            }
            break;
          }

          case 'sim-tablet': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.role = 'TABLE';
            wipePrivateState();
            store.uiState.simOpen = false;
            store.uiState.screen = screenForCurrentRoom();
            saveSession();
            renderApp();
            scheduleAutoBot();
            break;
          }

          case 'sim-player': {
            const pid = el.getAttribute('data-pid');
            if (!pid || !store.uiState.localPlayers[pid]?.token) break;
            audioEngine.tap();
            haptics.tap();
            store.uiState.role = 'PLAYER';
            store.privateState.activePlayerId = pid;
            store.privateState.selectedTileId = null;
            store.privateState.selectedEnd = null;
            store.uiState.simOpen = false;
            store.uiState.screen = screenForCurrentRoom();
            saveSession();
            await syncLiveState({ navigate: true });
            break;
          }

          case 'sim-disconnect': {
            audioEngine.tap();
            store.uiState.simOpen = false;
            const next = !store.uiState.isDisconnected;
            store.uiState.isDisconnected = next;
            const room = store.publicState.room;
            const pid = store.privateState.activePlayerId;
            if (room && pid && store.uiState.localPlayers[pid]?.token) {
              playerService.setConnection(room.code, pid, store.uiState.localPlayers[pid].token, !next).catch(() => {});
            }
            renderApp();
            break;
          }

          case 'reconnect-now': {
            await performReconnect();
            break;
          }

          case 'leave-now': {
            audioEngine.tap();
            haptics.tap();
            store.uiState.simOpen = false;
            store.uiState.confirmHomeOpen = false;
            clearSession();
            store.uiState.screen = 'LANDING';
            renderApp();
            break;
          }
        }
      });

      // PWA Install Lifecycle Listeners
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        renderTopBar();
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        store.uiState.isStandalone = true;
        store.uiState.installModalOpen = false;
        showToast(t('installedDone'), 'gold');
        renderApp();
      });

      window.addEventListener('resize', () => {
        if (store.uiState.screen === 'TABLE_BOARD') {
          renderApp();
        }
      });

      window.addEventListener('offline', () => {
        if (store.publicState.room) {
          store.uiState.isDisconnected = true;
          renderModals();
        }
      });
      window.addEventListener('online', () => {
        if (store.publicState.room && store.uiState.isDisconnected) {
          performReconnect();
        }
      });

      // ======================================================================
      // 12. BOOTSTRAP, SERVICE WORKER & SPLASH DISMISSAL
      // ======================================================================
      async function boot() {
        loadPrefs();
        generateAppleTouchIcon();
        store.uiState.isStandalone = checkIsStandalone();

        // Register Service Worker if hosted on HTTP/HTTPS
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        const splash = document.getElementById('splash-screen');
        const dismissSplash = () => {
          if (!splash || splash.dataset.done) return;
          splash.dataset.done = '1';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => splash.remove(), 320);
        };
        if (splash) {
          document.getElementById('splash-title').textContent = t('brand');
          document.getElementById('splash-sub').textContent = t('eyebrow');
          splash.addEventListener('click', dismissSplash);
          setTimeout(dismissSplash, 1100);
        }

        const saved = loadSession();
        store.uiState.savedSession = saved;

        const params = new URLSearchParams(window.location.search);
        const joinParam = params.get('join');
        if (joinParam && joinParam.trim().length > 0) {
          store.uiState.joinDraft.code = joinParam.trim().toUpperCase().slice(0, 6);
          store.uiState.landingTab = 'PLAYER';
          store.uiState.screen = 'JOIN_ROOM';
          renderApp();
          return;
        }

        if (saved?.roomCode) {
          store.uiState.hostToken = saved.hostToken || null;
          store.uiState.role = saved.role || 'TABLE';
          store.privateState.activePlayerId = saved.activePlayerId || null;
          store.uiState.localPlayers = saved.localPlayers || {};
          renderApp();
          await syncLiveState({ navigate: true });
          return;
        }

        renderApp();
      }

      window.addEventListener('DOMContentLoaded', boot);
    })();
  </script>
</body>
</html>
